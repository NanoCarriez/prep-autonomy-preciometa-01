name: nanochief-native-event-probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nanochief-native-event-probe.yml"
      - "handoff/PREP_AUTONOMY_PRECIOMETA_01_BUILD_STATUS.json"

jobs:
  native-event-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Emit harmless NanoChief native-event probe
        run: |
          echo "GITHUB_NATIVE_EVENT_NANOCHIEF_AUTOWAKE_01_PROBE"
          echo "Follow-up: PRECIOMETA_GROKME_URL_RETURN_01"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
